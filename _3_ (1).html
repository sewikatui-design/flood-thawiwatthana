<!DOCTYPE html><html><head><meta charset="utf-8"><title>สร้างไอคอน</title></head>
<body style="font-family:sans-serif;padding:40px;background:#0f172a;color:#fff">
<h2>สร้างไอคอนแอปน้ำท่วมทวีวัฒนา</h2>
<button onclick="gen(192)" style="padding:12px 24px;font-size:16px">ดาวน์โหลด icon-192.png</button>
<button onclick="gen(512)" style="padding:12px 24px;font-size:16px">ดาวน์โหลด icon-512.png</button>
<div id="prev" style="margin-top:20px"></div>
<script>
function gen(S){
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'), u = S/512;

  // พื้นหลังไล่สี
  const g = x.createLinearGradient(0,0,S,S);
  g.addColorStop(0,'#0f172a'); g.addColorStop(1,'#0369a1');
  x.fillStyle = g; x.fillRect(0,0,S,S);

  // คลื่นน้ำ 3 ชั้น
  const waves = [[300,'#38bdf8',0.95],[350,'#0ea5e9',0.9],[400,'#0284c7',0.85]];
  waves.forEach(([y,col,al])=>{
    x.globalAlpha = al; x.fillStyle = col;
    x.beginPath(); x.moveTo(0, y*u);
    for(let i=0;i<=S;i+=2){
      x.lineTo(i, (y + Math.sin(i/(60*u)) * 22)*u);
    }
    x.lineTo(S,S); x.lineTo(0,S); x.closePath(); x.fill();
  });
  x.globalAlpha = 1;

  // หยดน้ำตรงกลาง
  x.fillStyle = '#e0f2fe';
  x.beginPath();
  x.moveTo(256*u, 110*u);
  x.bezierCurveTo(330*u,200*u, 350*u,250*u, 256*u,300*u);
  x.bezierCurveTo(162*u,250*u, 182*u,200*u, 256*u,110*u);
  x.closePath(); x.fill();

  // จุดเตือนสีแดง
  x.fillStyle = '#dc2626';
  x.beginPath(); x.arc(390*u, 150*u, 45*u, 0, Math.PI*2); x.fill();
  x.fillStyle = '#fff'; x.font = 'bold ' + (60*u) + 'px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('!', 390*u, 148*u);

  document.getElementById('prev').innerHTML = '';
  document.getElementById('prev').appendChild(c);
  c.toBlob(b=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'icon-' + S + '.png'; a.click();
  });
}
</script></body></html>
